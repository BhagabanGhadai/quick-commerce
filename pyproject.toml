[project]
name = "quick-commerce"
version = "0.1.0"
requires-python = ">=3.13"

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["node_modules"]

[tool.ruff.lint]
# E/F: errors, I: import sorting, UP: modern syntax, B: likely bugs
select = ["E", "F", "I", "UP", "B"]

[tool.vulture]
paths = ["main.py", "apps"]
# FastAPI calls route handlers itself, so they look unused to vulture.
ignore_decorators = ["@app.*", "@router.*"]
# Pydantic fields are read by FastAPI at runtime, so they look unused too.
exclude = ["*/schemas.py"]
min_confidence = 60

[tool.commitizen]
name = "cz_conventional_commits"
